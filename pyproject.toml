[project]
name = "degiro-explorer"
version = "0.1.0"
description = "Fetch, reconstruct and explore your DEGIRO portfolio history in a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomás Feith" }]
dependencies = [
    "degiro-connector[qrcode]>=3.0.36",
    "yfinance>=1.5.2",
    "pandas>=3.0.5",
    "numpy>=1.24",
    "streamlit>=1.60.0",
    "plotly>=5.20",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
    "mypy>=2.3",
    "pre-commit>=4.6.1",
    "types-PyYAML>=6.0",
    "hypothesis>=6.100",
]

[tool.uv]
# This is an application, not an installable library: config.py, scripts/ and
# dashboard/ live outside the degiro_explorer package and are run directly.
package = false

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]

[tool.mypy]
python_version = "3.14"
files = ["config.py", "degiro_explorer", "scripts", "dashboard", "tests"]
warn_unused_ignores = false
check_untyped_defs = true
# Pragmatic settings for an app that wasn't written type-first: surface real
# errors without demanding annotations on every function.
disallow_untyped_defs = false

# Named explicitly rather than a blanket ignore_missing_imports, so an import
# that stops resolving is an error rather than being silently accepted.
#
# pandas is on this list reluctantly. Adding pandas-stubs was tried and backed
# out: it surfaced 186 errors, 164 of them in reconstruct.py, almost all from
# the stubs being strict about the scalar types that fall out of DataFrame and
# Series indexing. Those are worth fixing, but it is its own piece of work
# rather than a config change -- do it module by module, starting with
# reconstruct.py, and drop pandas from this list when it is clean.
[[tool.mypy.overrides]]
module = ["degiro_connector.*", "pandas", "plotly.*", "yfinance"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov --cov-report=term-missing"
# For a targeted run that would trip the floor: uv run pytest -k foo --no-cov

[tool.coverage.run]
source = ["degiro_explorer", "scripts"]
source_pkgs = ["config"] # top-level module, not a package dir -- `source` would skip it
omit = ["dashboard/*"] # Streamlit UI: rendered end-to-end by tests/test_dashboard.py

[tool.coverage.report]
# A ratchet, not an aspiration: currently ~74%, so this only catches regressions.
# Raise it as tests land rather than picking a number the suite cannot honestly meet.
fail_under = 70
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
