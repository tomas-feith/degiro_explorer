[project]
name = "degiro-explorer"
version = "0.1.0"
description = "Fetch, reconstruct and explore your DEGIRO portfolio history in a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = [
    "degiro-connector[qrcode]>=3.0.36",
    "yfinance>=0.2.40",
    "pandas>=3.0.5",
    "numpy>=1.24",
    "streamlit>=1.60.0",
    "plotly>=5.20",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
    "mypy>=2.3",
    "pre-commit>=4.6.1",
    "types-PyYAML>=6.0",
]

[tool.uv]
# This is an application, not an installable library: config.py, scripts/ and
# dashboard/ live outside the degiro_explorer package and are run directly.
package = false

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]

[tool.mypy]
python_version = "3.14"
files = ["config.py", "degiro_explorer", "scripts", "dashboard", "tests"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
# Pragmatic settings for an app that wasn't written type-first: surface real
# errors without demanding annotations on every function.
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov --cov-report=term-missing"
# For a targeted run that would trip the floor: uv run pytest -k foo --no-cov

[tool.coverage.run]
source = ["degiro_explorer", "scripts"]
source_pkgs = ["config"] # top-level module, not a package dir -- `source` would skip it
omit = ["dashboard/*"] # Streamlit UI: exercised by running it, not by unit tests

[tool.coverage.report]
# A ratchet, not an aspiration: currently ~43%, so this only catches regressions.
# Raise it as tests land rather than picking a number the suite cannot honestly meet.
fail_under = 40
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
